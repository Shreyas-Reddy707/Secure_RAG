services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: securerag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - securerag_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securerag-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - FASTEMBED_CACHE_PATH=/app/.fastembed_cache
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - fastembed_cache:/app/.fastembed_cache
    depends_on:
      - qdrant
    networks:
      - securerag_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securerag-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - securerag_net

volumes:
  qdrant_storage:
  fastembed_cache:

networks:
  securerag_net:
    driver: bridge

